[project]
name = "skyjo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MalteSchul", email = "mschulzeb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
skyjo = "skyjo:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "B"]

[tool.uv.sources]
# This service never runs on a GPU; PyPI's default Linux torch wheel pulls in
# ~2GB of unused nvidia-cu13-* packages, so pin to PyTorch's CPU-only index.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
